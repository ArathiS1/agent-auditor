name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: pytest -q

  postgres:
    # The same suite against PostgreSQL. Experimental: SQLite is the supported test backend until this is green.
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auditor
          POSTGRES_PASSWORD: auditor
          POSTGRES_DB: auditor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditor -d auditor_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://auditor:auditor@localhost:5432/auditor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build the image
        run: docker build -t agent-auditor:ci .
      - name: Smoke test (SQLite, migrations, health)
        run: |
          docker run -d --name auditor -p 8000:8000 \
            -e AUDITOR_DATABASE_URL=sqlite:////tmp/ci.db -e AUDITOR_AUTO_CREATE_TABLES=false \
            agent-auditor:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/readyz && exit 0
            sleep 1
          done
          docker logs auditor
          exit 1
