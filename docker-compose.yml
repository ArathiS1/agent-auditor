# docker compose up --build        (needs a .env file; see .env.example)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: auditor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["api"]
    environment: &app_env
      AUDITOR_DATABASE_URL: postgresql+psycopg://auditor:${POSTGRES_PASSWORD}@db:5432/auditor
      AUDITOR_API_KEY: ${AUDITOR_API_KEY:?set AUDITOR_API_KEY in .env}
      AUDITOR_AUTO_CREATE_TABLES: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    build: .
    command: ["worker", "--interval", "30"]
    environment: *app_env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
