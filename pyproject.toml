[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-auditor"
version = "0.13.0"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Arathi" }]
keywords = ["ai-agents", "llm", "evaluation", "observability", "regression-testing", "canary", "mlops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Framework :: FastAPI",
]
description = "Open-source reliability layer for AI agents: traces, evals, drift, failure-to-test, root cause, canaries, rollback."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "alembic>=1.13",
]

[project.urls]
Homepage = "https://arathis1.github.io/agent-auditor/"
Documentation = "https://arathis1.github.io/agent-auditor/docs/"
Repository = "https://github.com/ArathiS1/agent-auditor"
Issues = "https://github.com/ArathiS1/agent-auditor/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]

[project.scripts]
agent-auditor = "agent_auditor.cli:main"
agent-auditor-worker = "agent_auditor.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_auditor = ["dashboard/*.html", "dashboard/*.js", "dashboard/js/*.js", "dashboard/*.css", "data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F", "E9"]
